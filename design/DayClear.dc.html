<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif; }
    a { color: #159fb8; } a:hover { color: #0f7f94; }
    @keyframes lo-pop { 0% { transform: scale(0.92); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #141517; color: #2b2c30; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Nunito Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; background: #202126; opacity: 0.6;"></div>
  <div style="position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin-left: -260px; margin-top: -260px; border-radius: 999px; background: radial-gradient(circle, rgba(31,185,210,0.28) 0%, rgba(31,185,210,0) 65%);"></div>

  <!-- Modal: dark header, light body -->
  <div style="position: relative; width: 330px; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,0.6); animation: lo-pop 420ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;">
    <div style="height: 44px; background: #2a2b30; display: flex; align-items: center; justify-content: center; position: relative; font-size: 14px; font-weight: 900; color: #ffffff;">
      <span>Daily Mission Clear</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" style="position: absolute; right: 14px; top: 14px;"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </div>

    <!-- Sky banner like the Hero Power card -->
    <div style="height: 96px; background: linear-gradient(180deg, #56a9e8 0%, #a9dcff 100%); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;">
      <svg viewBox="0 0 330 96" width="330" height="96" style="position: absolute; left: 0; top: 0;" fill="#ffffff">
        <path d="M40 22 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity="0.9"></path>
        <path d="M280 14 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.9"></path>
        <path d="M250 70 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z" opacity="0.8"></path>
        <circle cx="70" cy="72" r="2" opacity="0.7"></circle>
        <circle cx="300" cy="50" r="1.5" opacity="0.7"></circle>
      </svg>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="font-size: 34px; font-weight: 900; color: #ffffff; letter-spacing: 0.02em; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,0.18);">DAY CLEAR</div>
        <div style="font-size: 12px; font-weight: 800; color: #ffffff; opacity: 0.95;">Sunday · 4 of 4 missions</div>
      </div>
    </div>

    <div style="background: #e6e7ea; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <!-- Reward tiles -->
      <div style="display: flex; gap: 10px;">
        <div style="width: 74px; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
          <div style="height: 58px; display: flex; align-items: center; justify-content: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="#f2c21b" stroke="#b58900" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle></svg></div>
          <div style="width: 100%; background: #1a1a1c; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: #ffffff; text-align: center; line-height: 18px;">100</div>
        </div>
        <div style="width: 74px; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
          <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #2b2c30;">XP</div>
          <div style="width: 100%; background: #1a1a1c; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: #ffffff; text-align: center; line-height: 18px;">50</div>
        </div>
        <div style="width: 74px; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
          <div style="height: 58px; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#159fb8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-9 9-6-6z"></path><path d="M5 19l-2 2"></path><path d="M9 13l2 2"></path></svg></div>
          <div style="width: 100%; background: #1a1a1c; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: #ffffff; text-align: center; line-height: 18px;">+24 LP</div>
        </div>
      </div>

      <!-- Attendance card -->
      <div style="width: 100%; background: #ffffff; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="font-size: 12px; font-weight: 900; color: #2b2c30;">Attendance</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: #6f7076;">Day 12 / 28</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;">
          <div style="height: 26px; border-radius: 6px; background: #cfd0d4; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg></div>
          <div style="height: 26px; border-radius: 6px; background: #cfd0d4; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg></div>
          <div style="height: 26px; border-radius: 6px; background: #cfd0d4; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg></div>
          <div style="height: 26px; border-radius: 6px; background: #cfd0d4; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg></div>
          <div style="height: 26px; border-radius: 6px; background: linear-gradient(180deg, #b5ec3a, #8fcf1a); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,0.2);">12</div>
          <div style="height: 26px; border-radius: 6px; background: #f4f4f6; border: 1px solid #d9dade; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; color: #6f7076;">13</div>
          <div style="height: 26px; border-radius: 6px; background: #f4f4f6; border: 1.5px solid #f2c21b; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="#f2c21b" stroke="#b58900" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle></svg></div>
        </div>
        <div style="font-size: 11px; font-weight: 700; color: #6f7076;">2 more clears to the Day 14 bonus</div>
      </div>

      <div style="width: 100%; height: 46px; border-radius: 9px; background: linear-gradient(180deg, #b5ec3a, #8fcf1a); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 12px rgba(143,207,26,0.35); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,0.2);">Claim Reward</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
